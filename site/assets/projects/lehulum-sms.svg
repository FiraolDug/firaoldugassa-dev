<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lehulum SMS project cover">
  <defs>
    <linearGradient id="mgI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <pattern id="gridI" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="600" fill="url(#mgI)"/>
  <rect width="900" height="600" fill="url(#gridI)"/>
  <circle cx="150" cy="470" r="220" fill="#f2b134" fill-opacity="0.09"/>
  <g transform="translate(560,100)">
    <rect x="0" y="0" width="220" height="230" rx="34" fill="#0f1830" stroke="#f2b134" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="18" y="26" width="184" height="150" rx="10" fill="#0a1122"/>
    <g font-family="'JetBrains Mono', monospace" font-size="12">
      <rect x="32" y="40" width="120" height="24" rx="12" fill="#131c34"/>
      <text x="44" y="56" fill="#5fd4d4">Order confirmed</text>
      <rect x="60" y="72" width="130" height="24" rx="12" fill="#f2b134" fill-opacity="0.2"/>
      <text x="72" y="88" fill="#f2b134">OTP: 4821</text>
      <rect x="32" y="104" width="140" height="24" rx="12" fill="#131c34"/>
      <text x="44" y="120" fill="#5fd4d4">Reminder sent</text>
    </g>
    <circle cx="110" cy="200" r="16" fill="#f2b134"/>
    <path d="M102 200 l6 6 12 -12" stroke="#0a1122" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="'JetBrains Mono', monospace" fill="#93a0bd">
    <text x="70" y="90" font-size="15" letter-spacing="3" fill="#f2b134">// MESSAGING PLATFORM</text>
    <text x="70" y="140" font-size="44" fill="#eef2fb" font-weight="700">Lehulum SMS</text>
    <text x="70" y="176" font-size="16">Node.js &#183; REST API &#183; PostgreSQL</text>
  </g>
  <g transform="translate(70,220)" font-family="'JetBrains Mono', monospace" font-size="13" fill="#5fd4d4">
    <text y="0">$ sms send --batch</text>
    <text y="22" fill="#93a0bd">&#8250; 1 recipient queued</text>
    <text y="44" fill="#93a0bd">&#8250; delivery: confirmed</text>
  </g>
</svg>
