  <meta name="twitter:description" content="Full-stack software engineer building resilient mobile, web, and backend systems.">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components-buttons.css">
  <link rel="stylesheet" href="css/components-header.css">
  <link rel="stylesheet" href="css/components-hero.css">
  <link rel="stylesheet" href="css/components-content.css">
  <link rel="stylesheet" href="css/components-projects.css">
  <link rel="stylesheet" href="css/components-misc.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Firaol Dugassa",
    "jobTitle": "Software Engineer",
    "url": "https://firaol.dev/",
    "email": "mailto:firaoldugassa@gmail.com",
    "address": { "@type": "PostalAddress", "addressLocality": "Addis Ababa", "addressCountry": "ET" },
    "sameAs": [
      "https://github.com/FiraolDug",
      "https://www.linkedin.com/in/firaol-dugassa-dev84a913369",
      "https://t.me/firaol_dugassa"
    ]
  }

</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader__mark">
      <span>LOADING PORTFOLIO</span>
      <div class="preloader__bar"></div>
    </div>
  </div>

  <header class="header" id="header">
    <div class="container header__container">
      <a class="header__brand" href="#hero" aria-label="Firaol Dugassa — home">
        <span class="header__brand-mark">FD</span>
        <span class="header__brand-text" id="brand-text">Firaol<span>.dev</span></span>
      </a>

      <nav class="nav" id="nav-menu" aria-label="Primary">
        <ul class="nav__list" id="nav-list"></ul>
      </nav>

      <div class="header__actions">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme" aria-pressed="false">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="burger" id="burger-menu" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content">

    <!-- ================= HERO ================= -->
    <section class="hero" id="hero">
      <div class="hero__bg" aria-hidden="true"></div>
      <div class="container hero__grid">
        <div class="hero__content">
          <p class="hero__eyebrow" id="hero-eyebrow"></p>
          <p class="hero__greeting" id="hero-greeting"></p>
          <h1 class="hero__name" id="hero-name"></h1>
          <div class="hero__role">
            <span id="hero-role-static"></span>
            <span class="hero__typing" id="hero-typing"></span>
          </div>
          <p class="hero__description" id="hero-description"></p>
          <div class="hero__meta" id="hero-meta"></div>
          <div class="hero__actions" id="hero-actions"></div>
          <div class="hero__socials" id="hero-socials"></div>
        </div>

        <div class="hero__visual" aria-hidden="true">
          <div class="console">
            <div class="console__bar">
              <span class="console__dot"></span><span class="console__dot"></span><span class="console__dot"></span>
              <span class="console__title" id="console-status-label"></span>
            </div>
            <div class="console__body">
              <div class="console__status">
                <span class="console__status-label">STATUS</span>
                <span class="badge badge--good" id="console-status"></span>
              </div>
              <div class="console__metrics" id="console-metrics"></div>
              <div class="console__log" id="console-log"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="hero__scroll-cue" aria-hidden="true">
        <span>SCROLL</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </section>

    <!-- ================= STATS ================= -->
    <section class="section section--tight section--muted" id="stats" aria-label="Quick facts">
      <div class="container">
        <div class="stats" id="stats-grid"></div>
      </div>
    </section>

    <!-- ================= ABOUT ================= -->
    <section class="section" id="about">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" id="about-eyebrow"></p>
          <h2 class="section-title" id="about-title"></h2>
        </div>
        <div class="about__grid" id="about-grid"></div>
      </div>
    </section>

    <!-- ================= SKILLS ================= -->
    <section class="section section--muted" id="skills">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" id="skills-eyebrow"></p>
          <h2 class="section-title" id="skills-title"></h2>
        </div>
        <div class="skills__grid" id="skills-grid"></div>
        <div class="tools-row" id="tools-row"></div>
      </div>
    </section>

    <!-- ================= PROJECTS ================= -->
    <section class="section" id="projects">
      <div class="container">
        <div class="section-head section-head--spread">
          <div>
            <p class="eyebrow" id="projects-eyebrow"></p>
            <h2 class="section-title" id="projects-title"></h2>
            <p class="section-desc" id="projects-desc"></p>
          </div>
          <div class="filter-bar" id="project-filters" role="tablist" aria-label="Filter projects by category"></div>
        </div>
        <div class="projects__grid" id="projects-grid"></div>
      </div>
    </section>

    <!-- ================= GITHUB (live) ================= -->
    <section class="section section--muted" id="github">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" id="github-eyebrow"></p>
          <h2 class="section-title" id="github-title"></h2>
          <p class="section-desc" id="github-desc"></p>
        </div>
        <div class="gh-console">
          <div class="gh-profile card" id="gh-profile"></div>
          <div class="gh-repos card">
            <div class="gh-repos__header">
              <span>$ gh repo list --sort=stars</span>
              <span>top repositories</span>
            </div>
            <div class="gh-repo-list" id="gh-repo-list"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= EXPERIENCE ================= -->
    <section class="section" id="experience">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" id="experience-eyebrow"></p>
          <h2 class="section-title" id="experience-title"></h2>
        </div>
        <div class="timeline" id="experience-timeline"></div>
      </div>
    </section>

    <!-- ================= EDUCATION ================= -->
    <section class="section section--muted" id="education">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" id="education-eyebrow"></p>
          <h2 class="section-title" id="education-title"></h2>
        </div>
        <div class="timeline" id="education-timeline"></div>
      </div>
    </section>

    <!-- ================= CERTIFICATIONS ================= -->
    <section class="section" id="certifications">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow">// credentials</p>
          <h2 class="section-title">A few credentials along the way.</h2>
        </div>
        <div class="certs__grid" id="certifications-grid"></div>
      </div>
    </section>

    <!-- ================= CONTACT ================= -->
    <section class="section section--muted" id="contact">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" id="contact-eyebrow"></p>
          <h2 class="section-title" id="contact-title"></h2>
          <p class="section-desc" id="contact-desc"></p>
        </div>
        <div class="contact__grid">
          <div class="contact-card card">
            <div class="contact-channels" id="contact-channels"></div>
          </div>

          <form class="form card" id="contact-form" autocomplete="off" novalidate>
            <div class="form__group">
              <label class="form__label" for="contact-name">Name</label>
              <input class="form__input" id="contact-name" name="name" type="text" required placeholder="Your name" autocomplete="name">
            </div>
            <div class="form__group">
              <label class="form__label" for="contact-email">Email</label>
              <input class="form__input" id="contact-email" name="email" type="email" required placeholder="you@company.com" autocomplete="email">
            </div>
            <div class="form__group">
              <label class="form__label" for="contact-message">Project brief</label>
              <textarea class="form__input form__input--textarea" id="contact-message" name="message" required placeholder="Tell me about your product or idea."></textarea>
            </div>
            <button class="btn btn--primary" type="submit">Send message</button>
            <p class="form__status" id="form-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__container">
      <p class="footer__copy" id="footer-copy"></p>
      <div class="footer__socials" id="footer-socials"></div>
    </div>
  </footer>

  <button class="back-to-top" id="back-to-top" type="button" aria-label="Back to top" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 15 6-6 6 6"/></svg>
  </button>

  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/content.js"></script>
  <script src="js/github.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/portfolio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
